[package]
name = "context"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/context-engine",
    "crates/context-lexer",
    "crates/context-parser",
]

[dependencies]
context-engine = { path = "crates/context-engine" }
rmcp = { version = "=2.2.0", features = ["transport-io"] }
schemars = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
